name: Android Debug

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify immersive stage timing and architecture
        run: ./gradlew :shared:testAndroidHostTest --tests '*Immersive*' --tests '*LyricsParserTest' --tests '*FoliaPerformanceTest' --tests '*FuoThemeTest' checkArchitectureBoundaries :androidApp:lintDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  stage-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native CJK font fallback for stage rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'sans-serif:lang=zh'
          command -v ffmpeg >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Render native Compose stage previews
        run: ./gradlew :shared:desktopTest --tests 'org.feeluown.mobile.ImmersiveStageRenderTest' -Djava.awt.headless=true --stacktrace
      - name: Encode native glyph choreography preview
        run: ffmpeg -hide_banner -loglevel error -y -framerate 24 -i shared/build/stage-motion/frame-%03d.png -c:v libx264 -crf 18 -pix_fmt yuv420p shared/build/stage-previews/Glyph-motion.mp4
      - name: Upload phone and landscape previews
        uses: actions/upload-artifact@v4
        with:
          name: immersive-stage-previews
          path: |
            shared/build/stage-previews/*.png
            shared/build/stage-previews/*.mp4
          if-no-files-found: error
