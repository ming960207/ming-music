name: Android Debug

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify offline visual stage is packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -Z1 "$apk" | grep -Fx 'assets/folia_stage/index.html'
          unzip -p "$apk" 'assets/folia_stage/index.html' | grep -q 'stageReady'
          # Legacy Android WebView may not support dvh. Require an older-unit fallback.
          unzip -p "$apk" 'assets/folia_stage/index.html' | grep -Fq 'height:100vh;height:100dvh'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
