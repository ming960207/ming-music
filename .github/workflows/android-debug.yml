name: Android Debug

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify immersive stage timing and architecture
        run: ./gradlew :shared:testAndroidHostTest --tests '*Immersive*' --tests '*LyricsParserTest' --tests '*FoliaPerformanceTest' --tests '*FuoThemeTest' checkArchitectureBoundaries :androidApp:lintDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  stage-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Render native Compose stage previews
        run: ./gradlew :shared:desktopTest --tests 'org.feeluown.mobile.ImmersiveStageRenderTest' -Djava.awt.headless=true --stacktrace
      - name: Upload phone and landscape previews
        uses: actions/upload-artifact@v4
        with:
          name: immersive-stage-previews
          path: shared/build/stage-previews/*.png
          if-no-files-found: error
