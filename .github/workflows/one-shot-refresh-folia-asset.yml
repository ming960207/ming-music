name: One-time regenerate clean Folia stage asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-refresh-folia-asset.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Build reproducible offline Folia stage
        working-directory: web/folia-stage
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Commit the generated offline asset back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/commonMain/composeResources/files/folia-stage.html
          git diff --cached --quiet && { echo "Folia asset was not changed"; exit 1; }
          git commit -m "build(folia): ship clean stage without on-screen license panel"
          git push origin HEAD:main
