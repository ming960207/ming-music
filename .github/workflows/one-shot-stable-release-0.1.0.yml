name: One-time Ming Music 0.1.0 signed release dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stable-release-0.1.0.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing permanent signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-alpha.yml/dispatches" \
            -f ref=main \
            -f 'inputs[version_name]=0.1.0' \
            -f 'inputs[version_code]=100028' \
            -f 'inputs[channel]=stable'
          echo "Triggered Signed Android Release for Ming Music 0.1.0 stable"
