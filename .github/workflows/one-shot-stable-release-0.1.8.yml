name: One-time Ming Music 0.1.8 original Folia lockscreen release dispatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-stable-release-0.1.8.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanently signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-alpha.yml/dispatches" \
            -f ref=main \
            -f 'inputs[version_name]=0.1.8' \
            -f 'inputs[version_code]=100036' \
            -f 'inputs[channel]=stable'
