name: Release Ming Music Alpha 7 Temporary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.7'
    branches:
      - main
    paths:
      - '.release-alpha7-temp'
      - '.release-alpha7-temp-retry'
      - '.release-alpha7-temp-retry2'
      - '.release-alpha7-temp-final'
      - '.release-alpha7-temp-go'
      - '.release-alpha7-temp-run'
      - '.release-alpha7-temp-trigger'
      - '.release-alpha7-temp-launch'
      - '.release-alpha7-temp-launch2'
      - '.release-alpha7-temp-launch3'
      - '.release-alpha7-temp-now'
      - '.release-alpha7-temp-fire'
      - '.release-alpha7-temp-exec'
      - '.release-alpha7-temp-last'
      - '.release-alpha7-temp-ok'
      - '.release-alpha7-temp-really'
      - '.release-alpha7-temp-rerun'
      - '.release-alpha7-temp-rerun2'
      - '.release-alpha7-temp-rerun3'
      - '.release-alpha7-temp-rerun4'
      - '.release-alpha7-temp-rerun5'
      - '.release-alpha7-temp-rerun6'
      - '.release-alpha7-temp-rerun7'
      - '.release-alpha7-temp-rerun8'
      - '.release-alpha7-temp-rerun9'
      - '.release-alpha7-temp-rerun10'
      - '.release-alpha7-temp-finalrun'
      - '.release-alpha7-temp-finalrun2'
      - '.release-alpha7-temp-finalrun3'
      - '.release-alpha7-temp-finalrun4'
      - '.release-alpha7-temp-finalrun5'
      - '.release-alpha7-temp-finalrun6'
      - '.release-alpha7-temp-finalrun7'
      - '.release-alpha7-temp-finalrun8'
      - '.release-alpha7-temp-finalrun9'
      - '.release-alpha7-temp-finalrun10'
      - '.release-alpha7-temp-finalrun11'
      - '.release-alpha7-temp-finalrun12'
      - '.release-alpha7-temp-finalrun13'
      - '.release-alpha7-temp-finalrun14'
      - '.release-alpha7-temp-finalrun15'
      - '.release-alpha7-temp-finalrun16'
      - '.release-alpha7-temp-finalrun17'
      - '.release-alpha7-temp-finalrun18'
      - '.release-alpha7-temp-finalrun19'
      - '.release-alpha7-temp-finalrun20'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.7
      MING_VERSION_CODE: 100007
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build temporary debug-signed APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify APK identity and temporary signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='org.feeluown.mobile'"* ]]
          [[ "$BADGING" == *"versionCode='100007'"* ]]
          [[ "$BADGING" == *"versionName='0.1.0-alpha.7'"* ]]
          SIGNER="$("$APKSIGNER" verify --print-certs "$APK" | sed -n -E 's/^(Signer #1|V2 Signer): certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$SIGNER"
          echo "Temporary signer SHA-256: $SIGNER"

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.7.apk
          sha256sum MingMusic-0.1.0-alpha.7.apk > MingMusic-0.1.0-alpha.7.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.7" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.7.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.7/MingMusic-0.1.0-alpha.7.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.7 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.7 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.7 \
            MingMusic-0.1.0-alpha.7.apk \
            MingMusic-0.1.0-alpha.7.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 7 (Temporary)" \
            --notes "临时测试版：尚未配置永久 JKS，使用 CI debug 签名，仅用于当前功能测试。包含全局水墨/自定义主题背景、悬浮歌词与更新校验改进。此版本不能作为后续无感覆盖升级的签名基线；配置永久签名后将重新建立正式升级链路。"
