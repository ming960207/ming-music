name: Release Ming Music Alpha 17 Temporary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.17'
    branches:
      - main
    paths:
      - '.release-alpha17-temp'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.17
      MING_VERSION_CODE: 100017
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build temporary debug-signed APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and GitHub update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.17.apk
          sha256sum MingMusic-0.1.0-alpha.17.apk > MingMusic-0.1.0-alpha.17.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.17" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.17.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.17/MingMusic-0.1.0-alpha.17.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.17 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.17 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.17 \
            MingMusic-0.1.0-alpha.17.apk \
            MingMusic-0.1.0-alpha.17.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 17 (Temporary)" \
            --notes "临时测试版：修复开放音乐源实际搜索链。Openverse 现已加入全局开放源搜索；Audius、Jamendo、Openverse 多源并发搜索改为单源失败隔离，避免一个公网源异常导致全部结果清空；修复 Openverse duration 毫秒单位，改善智能匹配。此版本继续使用 CI debug 临时签名，仅用于功能测试。"
