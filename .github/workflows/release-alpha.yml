name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 0.1.0-alpha.27'
        required: true
        type: string
      version_code:
        description: 'Increasing versionCode, greater than 100026'
        required: true
        type: string
      channel:
        type: choice
        options: [canary, stable]
        default: canary

permissions:
  contents: read

concurrency:
  group: ming-music-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ming960207/ming-music' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MING_VERSION_NAME: ${{ inputs.version_name }}
      MING_VERSION_CODE: ${{ inputs.version_code }}
      CHANNEL: ${{ inputs.channel }}
      RELEASE_REPO: ming960207/release
      FUO_SIGNING_STORE_FILE: signing/ming-music-release.p12
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate inputs and restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MING_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$MING_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          (( MING_VERSION_CODE > 100026 && MING_VERSION_CODE <= 2100000000 ))
          for name in KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD RELEASE_TOKEN; do
            [[ -n "${!name}" ]] || { echo "Missing required secret: $name"; exit 1; }
          done
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"
          echo "RELEASE_TAG=ming-music-v$MING_VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=MingMusic-$MING_VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Regression checks
        run: python3 -m unittest discover -s tools/ci -p test_verify_android_release.py

      - name: Fetch previous permanent APK for upgrade comparison
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$RELEASE_REPO" --jq .private)" == false ]]
          python3 tools/ci/fetch_previous_release.py

      - name: Build permanent signed release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Verify APK before publishing
        shell: bash
        run: |
          set -euo pipefail
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$APK_NAME"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          previous=()
          if [[ -d signing/previous ]]; then
            mapfile -t apks < <(find signing/previous -name '*.apk')
            [[ ${#apks[@]} == 1 ]]
            previous=(--previous-apk "${apks[0]}")
          fi
          python3 tools/ci/verify_android_release.py "$APK_NAME" --aapt "$AAPT" --apksigner "$APKSIGNER" --version-name "$MING_VERSION_NAME" "${previous[@]}"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          COMMIT_SHA="$GITHUB_SHA" WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
            RELEASE_NOTES_URL="https://github.com/$RELEASE_REPO/releases/tag/$RELEASE_TAG" \
            bash scripts/write-update-manifest.sh "$CHANNEL" "$APK_NAME" ming-music-update.json \
            "https://github.com/$RELEASE_REPO/releases/download/$RELEASE_TAG/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ming-music-signed-${{ inputs.version_code }}
          path: |
            MingMusic-*.apk
            MingMusic-*.apk.sha256
            ming-music-update.json
          if-no-files-found: error

      - name: Publish verified immutable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # API errors must fail, rather than masquerade as a missing release.
          gh api --paginate --slurp "repos/$RELEASE_REPO/releases?per_page=100" > signing/releases-final.json
          python3 - <<'PY'
          import json, os
          releases = [r for page in json.load(open('signing/releases-final.json')) for r in page]
          assert not any(r['tag_name'] == os.environ['RELEASE_TAG'] for r in releases), 'Release already exists; refusing overwrite'
          PY
          flags=()
          [[ "$CHANNEL" != canary ]] || flags+=(--prerelease)
          printf '%s\n' "Permanent signed Android release. Source: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" > signing/notes.md
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" "$APK_NAME" "$APK_NAME.sha256" ming-music-update.json \
            --draft --title "Ming Music $MING_VERSION_NAME" --notes-file signing/notes.md "${flags[@]}"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false

      - name: Verify public download and manifest
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$RELEASE_REPO/releases/download/$RELEASE_TAG"
          curl --fail --location --retry 3 "$base/ming-music-update.json" -o signing/public-update.json
          cmp ming-music-update.json signing/public-update.json
          curl --fail --location --retry 3 "$base/$APK_NAME" -o signing/public.apk
          [[ "$(sha256sum "$APK_NAME" | cut -d ' ' -f1)" == "$(sha256sum signing/public.apk | cut -d ' ' -f1)" ]]

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f signing/ming-music-release.p12
