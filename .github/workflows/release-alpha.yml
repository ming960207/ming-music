name: Release Ming Music Alpha 12 Temporary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.12'
    branches:
      - main
    paths:
      - '.release-alpha11-temp'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.12
      MING_VERSION_CODE: 100012
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build temporary debug-signed APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and GitHub update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.12.apk
          sha256sum MingMusic-0.1.0-alpha.12.apk > MingMusic-0.1.0-alpha.12.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.12" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.12.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.12/MingMusic-0.1.0-alpha.12.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.12 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.12 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.12 \
            MingMusic-0.1.0-alpha.12.apk \
            MingMusic-0.1.0-alpha.12.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 12 (Temporary)" \
            --notes "临时测试版：尚未配置永久 JKS，使用 CI debug 签名，仅用于当前功能测试。恢复 QQ 音乐每日推荐歌单入口并修复推荐卡片渲染；QQ MV 使用多质量、多 CDN 播放地址自动兜底。Audius、Jamendo 现在固定参与全局搜索，即使 QQ/网易等常规音乐源已有结果也会合并展示，同时保留播放失败后的自动跨源兜底。保留现有水墨主题、悬浮歌词与更新校验。此版本不能作为后续无感覆盖升级的永久签名基线。"
