name: Release Ming Music Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android build
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          cp androidApp/build/outputs/apk/debug/*.apk MingMusic-0.1.0-alpha.1.apk
          sha256sum MingMusic-0.1.0-alpha.1.apk > MingMusic-0.1.0-alpha.1.apk.sha256
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-alpha.1 >/dev/null 2>&1; then
            echo "v0.1.0-alpha.1 already exists"
            exit 0
          fi
          gh release create v0.1.0-alpha.1 \
            MingMusic-0.1.0-alpha.1.apk \
            MingMusic-0.1.0-alpha.1.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 1" \
            --notes "首个 Ming Music Android 可安装测试版。包含 FuoEvolve 播放基线、Ming Music 品牌迁移初版、悬浮歌词（拖动、同步歌词、上一首/播放暂停/下一首、直接关闭）及悬浮窗权限入口。此版本为 Alpha，在线音乐可播放性受各 Provider 授权、地区和服务状态影响。"
