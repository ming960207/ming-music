name: Release Ming Music Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.7'
    branches:
      - main
    paths:
      - '.release-alpha7'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.7
      MING_VERSION_CODE: 100007
      ANDROID_SIGNING_KEY_JKS_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_JKS_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Require permanent Android signer
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEY_JKS_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEY_PASSWORD"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/ming-music-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEY_JKS_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "FUO_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "FUO_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FUO_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FUO_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list             -keystore "$KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build permanently signed release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='org.feeluown.mobile'"* ]]
          [[ "$BADGING" == *"versionCode='100007'"* ]]
          [[ "$BADGING" == *"versionName='0.1.0-alpha.7'"* ]]
          SIGNER="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$SIGNER"
          echo "Release signer SHA-256: $SIGNER"

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.7.apk
          sha256sum MingMusic-0.1.0-alpha.7.apk > MingMusic-0.1.0-alpha.7.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.7" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.7.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.7/MingMusic-0.1.0-alpha.7.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.7 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.7 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.7 \
            MingMusic-0.1.0-alpha.7.apk \
            MingMusic-0.1.0-alpha.7.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 7" \
            --notes "Ming Music Alpha 7。参照 MingTV 的固定签名发布链路，改为永久 JKS 签名的 Release APK；更新清单记录 APK SHA-256、大小和签名证书 SHA-256；应用内更新会分别报告哈希、包名、版本号和签名错误。保持 applicationId org.feeluown.mobile。旧临时调试签名安装仅需迁移一次，之后版本可覆盖升级并保留配置。"
