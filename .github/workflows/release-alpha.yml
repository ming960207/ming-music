name: Release Ming Music Alpha 26 Temporary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.26'
    branches:
      - main
    paths:
      - '.release-alpha26-temp'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.26
      MING_VERSION_CODE: 100026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build temporary debug-signed APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and GitHub update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.26.apk
          sha256sum MingMusic-0.1.0-alpha.26.apk > MingMusic-0.1.0-alpha.26.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.26" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.26.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.26/MingMusic-0.1.0-alpha.26.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.26 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.26 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.26 \
            MingMusic-0.1.0-alpha.26.apk \
            MingMusic-0.1.0-alpha.26.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 26 (Temporary)" \
            --notes "Alpha 26：新增 Folia 风格沉浸播放模式，支持歌词逐字高亮、翻译/罗马音、歌词点击跳转、封面氛围背景与横竖屏布局；保留原有播放控制和退出入口。此包使用 CI debug 临时签名，属于测试预览版，可能无法覆盖安装不同签名的旧版 APK。"
