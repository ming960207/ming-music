name: Release Ming Music Alpha 16 Temporary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.16'
    branches:
      - main
    paths:
      - '.release-alpha16-temp'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.16
      MING_VERSION_CODE: 100016
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build temporary debug-signed APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and GitHub update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.16.apk
          sha256sum MingMusic-0.1.0-alpha.16.apk > MingMusic-0.1.0-alpha.16.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.16" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.16.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.16/MingMusic-0.1.0-alpha.16.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.16 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.16 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.16 \
            MingMusic-0.1.0-alpha.16.apk \
            MingMusic-0.1.0-alpha.16.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 16 (Temporary)" \
            --notes "临时测试版：新增 Openverse 实验音源，使用匿名公网 API，无需 API Key、用户登录或私有服务器；支持搜索开放许可音频并解析可直接播放的媒体 URL/备用文件。Openverse 暂不加入默认智能兜底，先用于独立搜索与播放验证。保留 Audius、Jamendo 及现有音乐源和功能。此版本继续使用 CI debug 临时签名，仅用于功能测试。"
