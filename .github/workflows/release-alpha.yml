name: Release Ming Music Alpha 8 Temporary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-alpha.8'
    branches:
      - main
    paths:
      - '.release-alpha8-temp'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ming960207/ming-music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MING_VERSION_NAME: 0.1.0-alpha.8
      MING_VERSION_CODE: 100008
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build temporary debug-signed APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify updater points only to Ming Music GitHub
        run: |
          ! grep -R "feeluown.github.io/FuoEvolve/update\|raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist" androidApp/src/main/kotlin/org/feeluown/mobile/update
          grep -q "api.github.com/repos/ming960207/ming-music/releases" androidApp/src/main/kotlin/org/feeluown/mobile/update/AndroidAppUpdateController.kt

      - name: Prepare APK and GitHub update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" MingMusic-0.1.0-alpha.8.apk
          sha256sum MingMusic-0.1.0-alpha.8.apk > MingMusic-0.1.0-alpha.8.apk.sha256
          chmod +x scripts/write-update-manifest.sh
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/ming960207/ming-music/releases/tag/v0.1.0-alpha.8" \
          scripts/write-update-manifest.sh \
            canary \
            MingMusic-0.1.0-alpha.8.apk \
            ming-music-update.json \
            "https://github.com/ming960207/ming-music/releases/download/v0.1.0-alpha.8/MingMusic-0.1.0-alpha.8.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.8 >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.8 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.1.0-alpha.8 \
            MingMusic-0.1.0-alpha.8.apk \
            MingMusic-0.1.0-alpha.8.apk.sha256 \
            ming-music-update.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ming Music 0.1.0 Alpha 8 (Temporary)" \
            --notes "临时测试版：尚未配置永久 JKS，使用 CI debug 签名，仅用于当前功能测试。新增 Audius 开放音乐源、Jamendo 国际开放音乐源，以及原始来源失败后的 Audius → Jamendo 自动播放兜底。保留现有水墨主题、悬浮歌词与更新校验。此版本不能作为后续无感覆盖升级的永久签名基线。"
