name: TV Stage Debug

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tv-stage-expansion

permissions:
  contents: read

jobs:
  tv-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Build offline Folia stage from checked-in sources
        working-directory: web/folia-stage
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify packaged Folia bundle
        run: |
          python3 -m unittest discover -s tools/ci -p test_verify_folia_bundle.py
          python3 tools/ci/verify_folia_bundle.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - name: Verify 32-bit ARM native library compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("androidApp/build/outputs/apk/debug/androidApp-debug.apk")
          with ZipFile(apk) as archive:
              libraries = {name for name in archive.namelist() if name.startswith("lib/") and name.endswith(".so")}
          by_abi = {}
          for name in libraries:
              _, abi, filename = name.split("/")
              by_abi.setdefault(abi, set()).add(filename)
          print("Packaged native libraries by ABI:", {abi: sorted(names) for abi, names in sorted(by_abi.items())})
          if libraries:
              assert "armeabi-v7a" in by_abi, "APK contains native code but no armeabi-v7a libraries"
              other = set().union(*(names for abi, names in by_abi.items() if abi != "armeabi-v7a"))
              missing = other - by_abi["armeabi-v7a"]
              assert not missing, f"Missing 32-bit ARM native library variants: {sorted(missing)}"
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-tv-stage-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
