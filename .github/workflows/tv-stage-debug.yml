name: TV Stage Debug

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tv-stage-expansion

permissions:
  contents: read

jobs:
  tv-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Build offline Folia stage from checked-in sources
        working-directory: web/folia-stage
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify packaged Folia bundle
        run: |
          python3 -m unittest discover -s tools/ci -p test_verify_folia_bundle.py
          python3 tools/ci/verify_folia_bundle.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ming-music-tv-stage-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
