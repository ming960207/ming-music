<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Ming Music · Visual Stage</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1930;font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
#stage{position:relative;width:100vw;height:100%;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;contain:layout paint style;touch-action:manipulation;user-select:none}
#fog{position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(120deg,#5cafd4,#13172b)}
#shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 45%,transparent 19%,rgba(4,9,27,.48) 95%),linear-gradient(0deg,#081229e8,transparent 21%,transparent 70%,#081229a8)}
#diamond{position:absolute;left:9%;top:29%;width:min(35vw,38vh);height:min(35vw,38vh);border:1px solid #dbf6ff90;transform:rotate(45deg);box-shadow:0 0 18px #9decff33;animation:float 17s ease-in-out infinite alternate}
#diamond:after{content:"";position:absolute;inset:10%;border:1px solid #d9f5ff55}
@keyframes float{from{transform:rotate(44deg) scale(.94)}to{transform:rotate(48deg) scale(1.03)}}
#geo{position:absolute;inset:0;pointer-events:none;opacity:.62}
#geo svg{width:100%;height:100%}
#geo path,#geo line,#geo circle{fill:none;stroke:#d9faffad;stroke-width:1.15;vector-effect:non-scaling-stroke;stroke-dasharray:8 3;animation:dash 30s linear infinite}
@keyframes dash{to{stroke-dashoffset:200}}
#frame{position:absolute;inset:5% 6%;pointer-events:none}
.corner{position:absolute;width:28px;height:28px;border:1px solid #f2ffffaa}
.corner.tl{left:0;top:0;border-right:0;border-bottom:0}.corner.tr{right:0;top:0;border-left:0;border-bottom:0}.corner.bl{left:0;bottom:0;border-top:0;border-right:0}.corner.br{right:0;bottom:0;border-top:0;border-left:0}
#words{position:absolute;inset:0;pointer-events:none}
.w{position:absolute;white-space:nowrap;font-weight:800;line-height:1.1;letter-spacing:.01em;color:#f5fcff;text-shadow:0 0 8px #ecfeffb0,0 0 26px #55d1fd8a;will-change:transform,opacity,filter;opacity:0;transition:opacity .32s ease,transform .34s cubic-bezier(.2,.7,.3,1),filter .24s ease}
.w.waiting{opacity:.16;filter:blur(1.3px)}.w.singing{opacity:1;filter:brightness(1.38) drop-shadow(0 0 12px #b4efffa0)}.w.passed{opacity:.43}
#subtitle{position:absolute;bottom:16%;left:10%;right:10%;font-size:clamp(12px,2.2vh,17px);text-align:center;color:#e6f7ffd0;text-shadow:0 1px 9px #07112f;min-height:3em;pointer-events:none}
#empty{position:absolute;top:44%;width:100%;text-align:center;font-size:clamp(28px,7vw,60px);color:#e9fbff;display:none}
#mode{position:absolute;top:9%;left:8%;font-size:10px;letter-spacing:.18em;color:#e8f5ffaa}
#touch{position:absolute;inset:0;background:transparent}
@media(max-width:700px){#diamond{left:13%;top:27%;width:46vw;height:46vw}#subtitle{bottom:21%}#frame{inset:10% 7%}#mode{top:13%}}
@media(prefers-reduced-motion:reduce){#diamond,#geo path{animation:none}.w{transition:none}}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="动态歌词舞台">
  <canvas id="fog"></canvas>
  <div id="shade"></div>
  <div id="diamond"></div>
  <div id="geo"><svg viewBox="0 0 1000 600" preserveAspectRatio="none">
    <path d="M92 315H345 M488 300H652 M752 156V336 M602 89H683 M439 251v-16h31 M621 292v22h23 M719 375h-25v-18"/>
    <path d="M90 390q120 20 190-25 M690 405q110-65 195 10" opacity=".28"/>
    <circle cx="748" cy="308" r="16"/><circle cx="748" cy="308" r="5"/><circle cx="441" cy="312" r="3"/>
  </svg></div>
  <div id="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
  <div id="mode">MING MUSIC · 绘光</div><div id="words"></div><div id="empty">聆听此刻</div>
  <div id="subtitle"></div><div id="touch" aria-label="显示播放控制"></div>
</div>
<script>
"use strict";
// Report errors to Android instead of leaving the stage silently blank.
window.addEventListener('error', event => {
  try { window.MingMusicStage?.stageFailure('javascript: ' + (event.message || 'unknown')); } catch (_) {}
});
window.addEventListener('unhandledrejection', event => {
  try { window.MingMusicStage?.stageFailure('promise: ' + String(event.reason)); } catch (_) {}
});
(() => {
 const canvas=document.getElementById('fog'), ctx=canvas.getContext('2d',{alpha:false});
 if (!ctx) { window.MingMusicStage?.stageFailure('Canvas 2D context unavailable'); return; }
 const stage=document.getElementById('stage'),layer=document.getElementById('words');
 const subtitle=document.getElementById('subtitle'),empty=document.getElementById('empty');
 let song={id:'',offset:0,lines:[]},clock={ms:0,playing:false,stamp:performance.now()};
 let shown=-100,shownId='',elements=[],mode='studio',w=0,h=0,last=0,firstFrameSent=false;
 const reduced=typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion:reduce)').matches;
 function resize(){
  w=stage.clientWidth||window.innerWidth||document.documentElement.clientWidth;
  h=stage.clientHeight||window.innerHeight||document.documentElement.clientHeight;
  if(h<2){h=Math.max(1,window.innerHeight||screen.height);stage.style.height=h+'px';}
  const dpr=Math.min(devicePixelRatio||1,1.2)*.76;
  canvas.width=Math.max(1,Math.ceil(w*dpr));
  canvas.height=Math.max(1,Math.ceil(h*dpr));
 }
 addEventListener('resize',resize,{passive:true});resize();
 function playbackTime(){return Math.max(0,clock.ms+(clock.playing?performance.now()-clock.stamp:0)-song.offset)}
 function lines(){return (song.lines||[]).filter(x=>Number.isFinite(x.time)&&x.time>=0&&x.time<9e13&&x.text)}
 function lineIndex(t,a){let i=-1;for(let n=0;n<a.length;n++){if(a[n].time>t)break;i=n}return i}
 function timedWords(line,next){
  if(line.words&&line.words.length)return line.words;
  const chars=Array.from(line.text),duration=Math.max(600,Math.min(6500,(next?next.time:line.time+4200)-line.time));
  return chars.map((text,i)=>({text,time:line.time+i*duration/chars.length,duration:duration/chars.length}))
 }
 function layout(i,num){
  const desktop=[[8,42,1.15],[22,39,1.37],[38,43,1.13],[52,36,1.2],[69,28,1.9],[14,59,1],[32,57,1.18],[53,58,1.3],[75,60,1.83],[43,71,.9],[13,29,.85],[55,25,.85],[80,44,.8]];
  const phone=[[12,34,1.2],[39,37,1.18],[64,36,1.7],[12,50,1.18],[41,53,1.22],[66,57,1.68],[22,67,.95],[49,70,1.07],[75,74,.86],[14,27,.8]];
  const p=w<700?phone:desktop;return p[i%p.length]
 }
 function present(i,a){
  shown=i;layer.replaceChildren();elements=[];empty.style.display=(a.length&&i>=0)?'none':(a.length?'none':'block');
  if(i<0){subtitle.textContent='';return}
  const line=a[i],tokens=timedWords(line,a[i+1]).filter(x=>x.text&&x.text.trim());
  const unit=Math.min(w/17,h/10,w<700?44:70),scale=tokens.length>13?Math.max(.5,13/tokens.length):1;
  const frag=document.createDocumentFragment();
  tokens.forEach((v,n)=>{
   const node=document.createElement('span');node.className='w waiting';node.textContent=v.text;
   let [x,y,s]=layout(n,tokens.length);
   if(tokens.length<6){x=21+(n%3)*22;y=40+Math.floor(n/3)*20}
   node.style.left=x+'%';node.style.top=y+'%';
   node.style.fontSize=Math.round(unit*s*scale)+'px';
   node.style.transform='translate(-30%,-45%) scale(.92)';
   node.dataset.time=String(v.time);node.dataset.end=String(v.time+Math.max(120,v.duration||250));
   frag.appendChild(node);elements.push(node)
  });
  layer.appendChild(frag);
  subtitle.textContent=[line.translation,line.romanization,a[i+1]?.text].filter(Boolean).slice(0,2).join(' · ')
 }
 function draw(now){
  requestAnimationFrame(draw);
  if(!ctx||!w||!h||now-last<(reduced?100:w<700?40:28))return;last=now;
  const cw=canvas.width,ch=canvas.height, t=now*.00017;
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#101b35';ctx.fillRect(0,0,cw,ch);
  const base=ctx.createLinearGradient(0,0,cw,ch);
  base.addColorStop(0,'#5faed0');base.addColorStop(.39,'#296984');base.addColorStop(.69,'#20233f');base.addColorStop(1,'#14172a');
  ctx.fillStyle=base;ctx.fillRect(0,0,cw,ch);
  ctx.globalCompositeOperation='screen';
  const count=mode==='quiet'?6:16;
  for(let i=0;i<count;i++){
   const phase=i*1.8,cx=(.1+.84*(i%6)/6+.11*Math.sin(t*(.43+i%3*.14)+phase))*cw;
   const cy=(.12+.8*((i*7)%13)/13+.08*Math.cos(t*.8+phase))*ch;
   const r=(.20+(i%4)*.06)*Math.max(cw,ch),g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
   g.addColorStop(0,i%4===0?'rgba(72,209,244,.28)':'rgba(157,196,237,.22)');
   g.addColorStop(.49,'rgba(90,155,209,.11)');g.addColorStop(1,'rgba(10,20,38,0)');
   ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,r*2,r*2)
  }
  ctx.globalCompositeOperation='source-over';
  if(!firstFrameSent) {
    firstFrameSent=true;
    try { window.MingMusicStage?.stageReady(canvas.width,canvas.height); } catch (_) {}
  }
  const arr=lines(),tm=playbackTime(),idx=lineIndex(tm,arr);
  if(idx!==shown||shownId!==song.id){shownId=song.id;present(idx,arr)}
  for(const el of elements){
   const s=+el.dataset.time,e=+el.dataset.end,ratio=Math.max(0,Math.min(1,(tm-s)/Math.max(1,e-s)));
   const state=tm<s?'waiting':tm<=e?'singing':'passed';
   if(el.dataset.state!==state){el.classList.remove('waiting','singing','passed');el.classList.add(state);el.dataset.state=state}
   const size=state==='singing'?1.06+Math.sin(Math.PI*ratio)*.13:state==='passed'?.96:.92;
   el.style.transform='translate(-30%,-45%) scale('+size.toFixed(3)+')'
  }
 }
 requestAnimationFrame(draw);
 window.mingFolia={
  status(){return JSON.stringify({ready:firstFrameSent,width:canvas.width,height:canvas.height,lyrics:song.lines?.length||0,mode});},
  setSong(data){const v=typeof data==='string'?JSON.parse(data):data;song={id:String(v.id||''),offset:Number(v.offset)||0,lines:v.lines||[]};shown=-100;shownId=''},
  sync(ms,playing){const expected=clock.ms+(clock.playing?performance.now()-clock.stamp:0),next=Math.max(0,Number(ms)||0);
   if(Math.abs(expected-next)>125||clock.playing!==!!playing)clock={ms:next,playing:!!playing,stamp:performance.now()}},
  setMode(next){mode=String(next||'studio');document.getElementById('mode').textContent='MING MUSIC · '+({studio:'绘光',lumiere:'流光',poetry:'浮名',quiet:'静谧',classic:'经典'}[mode]||'绘光')}
 };
 document.getElementById('touch').addEventListener('click',()=>{try{window.MingMusicStage?.toggleControls()}catch(e){}});
})();
</script>
</body>
</html>
